backend = "glx";
vsync = true;
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.3;
corner-radius = 10;
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;
inactive-opacity = 0.7;
frame-opacity = 0.7;

blur: {
  method = "dual_kawase";
  strength = 5;
};

blur-background-exclude = [
	"class_i = 'gnome-screenshot'"
]
