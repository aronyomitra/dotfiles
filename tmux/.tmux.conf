# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Settings
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g display-panes-time 1000
set -s escape-time 10
set -g history-limit 100000
set -g display-time 5000
set -g status-interval 10
set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",*:Ss=\E[%p1%d q:Se=\E[ q"
set -g focus-events on
setw -g aggressive-resize on
set -g allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g set-clipboard on

set-option -a terminal-features 'xterm-256color:RGB:graphics:hyperlinks'

# Use vim keys to navigate copy modeh
setw -g mode-keys vi

# Bindings

# ----- POPUPS -----
# We will create a key table that holds bindings for a key mode (we will call it popup-mode) 
# Prefix + u will put us into popup binding mode (u for popUp?)
# After that each keypress will open up a different application in a popup - eg. git, db, scratch shell, interpreter REPL

bind u switch-client -T popup-mode
# Temporary popups
# ----------------
# Simple binding for a temporary shell in same directory
bind -T popup-mode s display-popup -w 75% -h 75% -b rounded -d '#{pane_current_path}' -E "bash"

# TUI File Manager in the current directory
bind -T popup-mode f display-popup -w 75% -h 75% -b rounded -d '#{pane_current_path}' -E "yazi"


# Simple binding to launch lazygit in a popup in the same directory
# NOTE: Not persistent - pressing <ESC> and retriggering will open a new instance
# bind G display-popup -w 90% -h 90% -b rounded -d '#{pane_current_path}' -S 'bg=#21252b,fg=#abb2bf' -s 'fg=#abb2bf,bg=#21252b' 'lazygit'

# Persistent popups
# ----------------

# My solution to have persistent popups:
# There will be a dedicated session for holding popups called "popups"
# Each window in that session will hold a specific application with pre-defined names
# Like "shell", "lazygit"
# Add bindings to attach to popups:{window_name}

# At startup, the session called popups with required window names has to be created
# Check if session already exists - if not - set it up with windows - add more windows here as required
if-shell "tmux has-session -t popups 2>/dev/null" "" "new-session -d -s popups -n shell; new-window -t popups -n lazygit"

# It is a nested tmux session so set status off (only in that specific session) for less confusion
set-option -t popups status off

# Don't apply tmux colorings on the session called "popups"
set-window-option -t popups:shell window-style "bg=default,fg=default"
set-window-option -t popups:shell window-active-style "bg=default,fg=default"
set-window-option -t popups:shell pane-border-status off
set-window-option -t popups:lazygit window-style "bg=default,fg=default"
set-window-option -t popups:lazygit window-active-style "bg=default,fg=default"
set-window-option -t popups:lazygit pane-border-status off

# Popups that open persistent applications
# -s flag for popup BORDER styling
# -S flag for popup CONTENT styling
bind -T popup-mode u display-popup -w 75% -h 75% -b rounded -S 'bg=#21252b,fg=#98be65' -s 'fg=#abb2bf,bg=#21252b' "tmux attach -t popups:shell"
bind -T popup-mode g display-popup -w 95% -h 95% -b rounded -S 'bg=#21252b,fg=#abb2bf' -s 'fg=#abb2bf,bg=#21252b' "tmux attach -t popups:lazygit" 

# Pane navigation with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Swap panes with hjkl
bind H swap-pane -t "{left-of}"
bind J swap-pane -t "{down-of}"
bind K swap-pane -t "{up-of}"
bind L swap-pane -t "{right-of}"

# More intuitive split binds and open new shell in same directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind s switch-client -l

# Copy (yank) in copy mode like vim
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

# By default, copy mode search is not incremental, so explicit bindings are needed
bind-key -T copy-mode-vi / command-prompt -i -I "#{pane_search_string}" -p "(search down)" "send -X search-forward-incremental '%%%'"
bind-key -T copy-mode-vi ? command-prompt -i -I "#{pane_search_string}" -p "(search up)" "send -X search-backward-incremental '%%%'"

# Select a pane with index n with Alt-n
# NOTE: Needs no prefix
bind -n M-1 select-pane -t 1
bind -n M-2 select-pane -t 2
bind -n M-3 select-pane -t 3
bind -n M-4 select-pane -t 4
bind -n M-5 select-pane -t 5
bind -n M-6 select-pane -t 6
bind -n M-7 select-pane -t 7
bind -n M-8 select-pane -t 8
bind -n M-9 select-pane -t 9
bind -n M-0 select-pane -t 10

# Visual
	# Status bar color and style
	# set -g status-style "fg=white,bg=#282c34"

	# Change the color if prefix key is active
	set -g status-style "fg=#ffffff,bg=#{?client_prefix,#2a4531,#282c34}"
	set -g status-justify centre

	# Left side: Session name and hostname
	# This uses Unicode arrows for visual separation
	set -g status-left '#[fg=#98be65,bg=#282c34] #S #[fg=#282c34,bg=#98be65]#[fg=#282c34,bg=#98be65] #(whoami) #[fg=#98be65, bg=#282c34]'
	set -g status-left-length 40

	# Right side: Date, time, and server information
	set -g status-right '#[fg=#282c34,bg=#98b365]#[fg=#282c34,bg=#98be65] %H:%M #[fg=#98be65,bg=#282c34]#[fg=#ffffff,bg=#282c34] %a | %d-%b-%Y '
	set -g status-right-length 40

	# Style for active window
	set -g window-status-current-style "fg=#282c34,bg=#98be65"
	set -g window-status-current-format ' #[fg=#000000,bg=#98be65]#I:#W#{?window_zoomed_flag,[Z],} #[fg=#98be65,bg=#282c34]'

	# Style for inactive windows
	set -g window-status-style "fg=#ffffff,bg=#282c34"
	set -g window-status-format '#[fg=#282c34, bg=#282c34] #[fg=#ffffff,bg=#282c34]#I:#W#{?window_zoomed_flag,[Z],}  '

	#Panes
	set -g pane-active-border-style "fg=#98be65"
	set -g pane-border-style "fg=#aaaaaa"

	# Possible options are {"single", "double", "heavy"}
	set -g pane-border-lines single

	set -g pane-border-status top
	set -g pane-border-format " #{pane_index} #{pane_current_command} #{?window_zoomed_flag,[Z],} "

	set -g window-style "bg=#262626"
	set -g window-active-style "bg=#000000"

	set -g message-style "bg=#2a4531,fg=#cdd6f4"
	set -g message-command-style "bg=#2a4531,fg=#cdd6f4"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
